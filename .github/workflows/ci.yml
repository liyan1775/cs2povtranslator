name: CI

on:
  push:
    branches:
      - master
      - "chore/**"
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e ".[dev,comms]"

      - name: Reject secrets and generated assets
        run: python scripts/check_repository_hygiene.py --root .

      - name: Replay v0.9.8 golden baseline
        run: python scripts/check_golden_baseline.py --replay

      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Verify release entry point
        run: python scripts/launch_sanity_check.py
