[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cs2-pov-translator"
version = "0.8.6"
description = "Local-first guided CLI toolkit for CS2 POV bilingual subtitles, job artifacts, model management, transcription profiles, global/Dust2/Anubis glossary pilots, player alias mapping, K-D-A identity hints, and bilingual subtitle export."
readme = "README.zh.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "liyan1775"}]
dependencies = []

[project.optional-dependencies]
cs2 = ["demoparser2>=0.41", "zstandard>=0.23", "pyogg>=0.6.1a1"]
asr = ["faster-whisper>=1.1"]
dev = ["pytest>=8.0"]
all = ["demoparser2>=0.41", "zstandard>=0.23", "pyogg>=0.6.1a1", "faster-whisper>=1.1", "pytest>=8.0"]

[project.scripts]
cs2pov = "cs2pov.cli.commands:main"
cs2pov-wizard = "cs2pov.cli.wizard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2pov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
